name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
      # jsDelivr serves a tagged Widget forever, so catch syntax errors before a release.
      - run: node --check widget/t3-feedback.js
